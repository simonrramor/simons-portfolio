<meta charset="utf-8">
<title>Splits Music Video Feed</title>
<style>
  @font-face { font-family: Inter; font-style: normal; font-weight: 100 900; font-display: swap; src: url("inter.woff2") format("woff2"); }
  /* Square Spotify-green stage, frameless 375×812 screen centred and scaled to fit, vertical snap feed of Canvas cards */
  :root {
    --stage: #1ED760;
    --screen: #121212;
    --text: #FFFFFF;
    --subdued: rgba(255,255,255,.62);
    --bright: #1ED760;
    --hint: rgba(0,0,0,.55);
    --font: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--stage); overflow: hidden; font-family: var(--font); -webkit-font-smoothing: antialiased; }

  .stage { position: fixed; inset: 0; }
  .screen {
    position: absolute; left: 50%; top: 50%; width: 375px; height: 812px;
    border-radius: 46px; overflow: hidden; background: var(--screen);
    transform-origin: center; transform: translate(-50%, -50%) scale(var(--s, 1));
    isolation: isolate;
  }

  /* feed */
  .track { position: absolute; left: 16px; top: 0; width: 343px; touch-action: none; }
  .screen { touch-action: none; user-select: none; -webkit-user-select: none; }
  .card { position: absolute; left: 0; top: 0; will-change: transform; width: 343px; height: 451px; border-radius: 16px; overflow: hidden;
    background: #2a2a2a; cursor: pointer; }
  .bg { position: absolute; inset: 0; overflow: hidden; background: #000; }
  .bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }
  .bg iframe { position: absolute; left: 50%; top: 50%; width: 1080px; height: 608px; border: 0;
    transform: translate(-50%, -50%); pointer-events: none; opacity: 0; }
  .bg iframe.on { opacity: 1; }
  .card .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 263px;
    background: linear-gradient(to top, #2a2a2a 0%, rgba(42,42,42,0) 100%); }
  .card .top-shade { top: 0; bottom: auto; height: 120px;
    background: linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,.25) 55%, rgba(0,0,0,0) 100%); }
  .ui, .card .shade { opacity: 0; transition: opacity 420ms ease 120ms; }
  .card.active .ui, .card.active .shade { opacity: 1; }
  .card.active { cursor: default; }

  .top { position: absolute; left: 16px; right: 16px; top: 16px; height: 32px; }
  .np { position: absolute; left: 0; top: 7px; display: flex; gap: 6px; align-items: center;
    font-size: 11px; font-weight: 300; line-height: 16px; color: var(--subdued); white-space: nowrap; }
  .eq { display: flex; align-items: flex-end; gap: 2px; width: 13px; height: 12px; margin: 0 2px; }
  .eq b { flex: 1; height: 100%; background: var(--bright); border-radius: 1px; transform-origin: bottom;
    animation: eq 1s ease-in-out infinite alternate; }
  .eq b:nth-child(1) { animation-duration: .9s; animation-delay: -.3s; }
  .eq b:nth-child(2) { animation-duration: .7s; animation-delay: -.6s; }
  .eq b:nth-child(3) { animation-duration: 1.1s; animation-delay: -.1s; }
  @keyframes eq { 0% { transform: scaleY(.3); } 100% { transform: scaleY(1); } }
  .round { position: absolute; right: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0;
    background: rgba(0,0,0,.3); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  .header { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 16px; }
  .data { position: relative; height: 133px; }
  .title { position: absolute; left: -2px; right: 2px; bottom: 37px; margin: 0; color: var(--text);
    font-size: 32px; line-height: 34px; font-weight: 700; letter-spacing: -1.28px; text-wrap: balance; }
  .artists { position: absolute; left: 0; right: 0; bottom: 16px; height: 17px; overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, #000 82%, transparent); mask-image: linear-gradient(to right, #000 82%, transparent); }
  .artists span { display: inline-block; white-space: nowrap; font-size: 13px; line-height: 16px; font-weight: 300; color: var(--subdued); }
  .card.active .artists span { animation: marquee var(--mq, 18s) linear 1.6s infinite; }
  @keyframes marquee { 0%, 8% { transform: translateX(0); } 92%, 100% { transform: translateX(var(--mx, -200px)); } }
  .bar { position: absolute; left: 0; top: 129px; width: 56px; height: 4px; background: var(--accent); }

  .actions { position: relative; height: 32px; display: flex; align-items: center; justify-content: space-between; }
  .left { display: flex; gap: 24px; }
  .icon { width: 24px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .icon svg, .round svg { display: block; }
  .heart.on path { fill: var(--bright); stroke: var(--bright); }
  .heart:active, .play:active { transform: scale(.9); }
  .play { width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0; background: var(--text); cursor: pointer; display: grid; place-items: center; transition: transform .15s; }

  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* chrome */
  .status { position: absolute; left: 0; right: 0; top: 0; height: 44px; pointer-events: none; z-index: 2; }
  .time { position: absolute; left: 21px; top: 14px; width: 54px; text-align: center; color: var(--text);
    font-size: 15px; font-weight: 900; letter-spacing: -.3px; }
  .sys { position: absolute; right: 15px; top: 17px; display: flex; gap: 5px; align-items: center; }
  .home { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 100px; background: var(--text); z-index: 2; pointer-events: none; }

  .hint { position: fixed; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font: 400 12px/1.4 var(--font); color: var(--hint);
    transition: opacity .6s; }
  .hint.gone { opacity: 0; }
  kbd { font: inherit; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .card.active .artists span, .eq b { animation: none; }
  }
  .hint { display: none; }
</style>

<div class="stage">
  <div class="screen" id="screen">
    <div class="track" id="track"></div>

    <div class="status">
      <div class="time">9:41</div>
      <div class="sys">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="#fff" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="#fff" aria-hidden="true"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 .6 10 10 0 0 0 .9 3.5L2 4.6a8.5 8.5 0 0 1 6-2.4Z"/><path d="M8 5.4c1.4 0 2.7.5 3.7 1.4l1.1-1.1A7 7 0 0 0 8 3.8a7 7 0 0 0-4.8 1.9l1.1 1.1c1-.9 2.3-1.4 3.7-1.4Z"/><path d="M8 8.6c.5 0 1 .2 1.4.5L8 10.6 6.6 9.1c.4-.3.9-.5 1.4-.5Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="22" height="11.3" rx="2.7" stroke="#fff" opacity=".35"/><rect x="2.5" y="2.5" width="18" height="7.3" rx="1.3" fill="#fff"/><path d="M24 4.2v4a2.2 2.2 0 0 0 0-4Z" fill="#fff" opacity=".4"/></svg>
      </div>
    </div>
    <div class="home"></div>
  </div>
</div>
<div class="hint" id="hint">Scroll or drag to browse · <kbd>Space</kbd> pause auto-scroll · <kbd>↑</kbd><kbd>↓</kbd> step · <kbd>H</kbd> hide this</div>

<script>
const MIXES = [
  { title: "Blinding Lights", artist: "The Weeknd", meta: "After Hours · 2020", yt: "4NRXx6U8ABQ", start: 30, accent: "#E5312B" },
  { title: "bad guy", artist: "Billie Eilish", meta: "When We All Fall Asleep, Where Do We Go? · 2019", yt: "DyDfgMOUjCI", start: 22, accent: "#D7F23A" },
  { title: "As It Was", artist: "Harry Styles", meta: "Harry's House · 2022", yt: "H5v3kku4y6Q", start: 40, accent: "#F2A65A" },
  { title: "This Is America", artist: "Childish Gambino", meta: "Single · 2018", yt: "VYOjWnS4cMY", start: 52, accent: "#EDE6D6" },
  { title: "HUMBLE.", artist: "Kendrick Lamar", meta: "DAMN. · 2017", yt: "tvTRZJ-4EyI", start: 30, accent: "#E63B2E" },
  { title: "Take On Me", artist: "a-ha", meta: "Hunting High and Low · 1985", yt: "djV11Xbc914", start: 60, accent: "#9FC5E8" },
  { title: "Weapon of Choice", artist: "Fatboy Slim ft. Bootsy Collins", meta: "Halfway Between the Gutter and the Stars · 2000", yt: "wCDIYvFmgW8", start: 62, accent: "#F6DE06" },
  { title: "Chandelier", artist: "Sia", meta: "1000 Forms of Fear · 2014", yt: "2vjPBrBU-TM", start: 45, accent: "#F5D0A9" },
  { title: "Royals", artist: "Lorde", meta: "Pure Heroine · 2013", yt: "nlcIKh6sBtc", start: 30, accent: "#B9A7F0" },
  { title: "Uptown Funk", artist: "Mark Ronson ft. Bruno Mars", meta: "Uptown Special · 2014", yt: "OPf0YbXqDm0", start: 32, accent: "#FF7A45" },
  { title: "Levitating", artist: "Dua Lipa ft. DaBaby", meta: "Future Nostalgia · 2020", yt: "TUVcZfQe-Kw", start: 40, accent: "#FF5FB0" },
  { title: "Running Up That Hill", artist: "Kate Bush", meta: "Hounds of Love · 1985", yt: "wp43OdtAAkM", start: 40, accent: "#C9C9C9" },
  { title: "Somebody That I Used to Know", artist: "Gotye ft. Kimbra", meta: "Making Mirrors · 2011", yt: "8UVNT4wvIGY", start: 60, accent: "#E8A87C" },
  { title: "Midnight City", artist: "M83", meta: "Hurry Up, We're Dreaming · 2011", yt: "dX3k_QDnzHE", start: 30, accent: "#6EC6FF" },
  { title: "Espresso", artist: "Sabrina Carpenter", meta: "Short n' Sweet · 2024", yt: "eVli-tstM5E", start: 30, accent: "#F2C38B" },
];
let previewActive = !new URLSearchParams(location.search).has("preview");
let animationFrame;
const N = MIXES.length;
const STEP = 467, TOP = 181, HOLD = 2000;

const ICON = {
  heart: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M16.76 2.42a6.03 6.03 0 0 1 3.98 1.77 6.06 6.06 0 0 1 0 8.5l-6.84 8.01a2.48 2.48 0 0 1-3.8 0l-6.86-8.04c-2.32-2.32-2.32-6.13.03-8.48a6.04 6.04 0 0 1 8.1-.37s.27.23.63.23c.35 0 .63-.22.64-.23a6.03 6.03 0 0 1 4.12-1.39Z" fill="none" stroke="#fff" stroke-width="1.1"/></svg>',
  more:  '<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><circle cx="4.5" cy="12.5" r="1.8"/><circle cx="12" cy="12.5" r="1.8"/><circle cx="19.5" cy="12.5" r="1.8"/></svg>',
  play:  '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.2 1.1v9.8c0 .6.6.95 1.15.65l8.1-4.7a.75.75 0 0 0 0-1.3l-8.1-4.7C2.8.15 2.2.5 2.2 1.1Z" fill="#121212"/></svg>',
  pause: '<svg width="12" height="12" viewBox="0 0 12 12" fill="#121212"><rect x="2" y="1" width="3" height="10" rx=".8"/><rect x="7" y="1" width="3" height="10" rx=".8"/></svg>',
  muted: '<svg width="16" height="16" viewBox="0 0 16.25 16" fill="#fff"><path d="M8.25 14 3.05 11H.25V5h2.8l5.2-3v12ZM3.32 6H1.25v4h2.07l3.93 2.27V3.73L3.32 6Zm12.55-.15L13.73 8l2.14 2.15-.7.7-2.15-2.14-2.15 2.14-.7-.7L12.31 8l-2.14-2.15.7-.7 2.15 2.15 2.15-2.15.7.7Z"/></svg>',
  sound: '<svg width="16" height="16" viewBox="0 0 16 16" fill="#fff"><path d="M8.25 14 3.05 11H.25V5h2.8l5.2-3v12ZM3.32 6H1.25v4h2.07l3.93 2.27V3.73L3.32 6Z"/><path d="M10.6 5.2a4 4 0 0 1 0 5.6l-.7-.7a3 3 0 0 0 0-4.2l.7-.7Zm2.1-2.1a7 7 0 0 1 0 9.8l-.7-.7a6 6 0 0 0 0-8.4l.7-.7Z"/></svg>',
};

const track = document.getElementById("track"), screen = document.getElementById("screen");
const cards = MIXES.map((m, i) => {
  const el = document.createElement("article");
  el.className = "card";
  el.dataset.mix = i % N;
  el.style.setProperty("--accent", m.accent);
  el.innerHTML = `
    <div class="bg"><img src="https://i.ytimg.com/vi/${m.yt}/maxresdefault.jpg" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${m.yt}/hqdefault.jpg'" alt=""></div>
    <div class="shade"></div>
    <div class="shade top-shade"></div>
    <div class="ui">
      <div class="top">
        <div class="np"><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></div>
        <button class="round mute" id="mute-${i}" aria-label="Unmute preview">${ICON.muted}</button>
      </div>
      <div class="header">
        <div class="data">
          <h2 class="title">${m.title}</h2>
          <div class="artists"><span>${m.artist} · ${m.meta}</span></div>
          <div class="bar"></div>
        </div>
        <div class="actions">
          <div class="left">
            <button class="icon heart" id="heart-${i}" aria-label="Save song" aria-pressed="false">${ICON.heart}</button>
            <button class="icon" id="more-${i}" aria-label="More options">${ICON.more}</button>
          </div>
          <button class="play" id="play-${i}" aria-label="Play song">${ICON.play}</button>
        </div>
      </div>
    </div>`;
  track.appendChild(el);

  const copies = sel => document.querySelectorAll(`.card[data-mix="${i % N}"] ${sel}`);
  el.querySelector(".heart").onclick = e => { e.stopPropagation(); const on = !e.currentTarget.classList.contains("on");
    copies(".heart").forEach(b => { b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }); };
  el.querySelector(".play").onclick = e => { e.stopPropagation(); const on = e.currentTarget.dataset.on !== "1";
    copies(".play").forEach(b => { b.dataset.on = on ? "1" : ""; b.innerHTML = on ? ICON.pause : ICON.play; b.setAttribute("aria-label", on ? "Pause song" : "Play song"); }); };
  el.querySelector(".mute").onclick = e => { e.stopPropagation(); const on = e.currentTarget.dataset.on !== "1";
    copies(".mute").forEach(b => { b.dataset.on = on ? "1" : ""; b.innerHTML = on ? ICON.sound : ICON.muted; b.setAttribute("aria-label", on ? "Mute preview" : "Unmute preview"); }); };
  el.addEventListener("click", () => { if (dragMoved) return; if (i !== active) { step(nearestDelta(i)); pauseAuto(); } });
  return el;
});

// marquee distance per card, measured once fonts load
document.fonts.ready.then(() => cards.forEach(c => {
  const s = c.querySelector(".artists span"), w = c.querySelector(".artists").clientWidth;
  const d = Math.max(0, s.scrollWidth - w + 24);
  s.style.setProperty("--mx", -d + "px");
  s.style.setProperty("--mq", Math.max(8, d / 22) + "s");
}));

// Continuous loop: every card sits at its distance from the scroll offset, wrapped around the full feed length,
// so scrolling past the last card leads straight into the first.
const L = N * STEP, mod = (a, b) => ((a % b) + b) % b;
let offset = 0, target = 0, active = -1, held = false, last = performance.now();
const state = cards.map(() => ({ frame: null, playing: null, revealTimer: null }));

// Official YouTube embed, muted and looping, scaled up so the 16:9 frame covers the card and the player chrome is cropped away.
function mount(card, m) {
  const f = document.createElement("iframe");
  const q = new URLSearchParams({ autoplay: 0, mute: 1, controls: 0, loop: 1, playlist: m.yt, playsinline: 1,
    rel: 0, iv_load_policy: 3, disablekb: 1, modestbranding: 1, fs: 0, cc_load_policy: 0, enablejsapi: 1, start: m.start });
  f.src = `https://www.youtube-nocookie.com/embed/${m.yt}?${q}`;
  f.allow = "autoplay; encrypted-media";
  f.title = `${m.artist} - ${m.title} music video`;
  f.tabIndex = -1;
  f.referrerPolicy = "strict-origin-when-cross-origin";
  // captions can be on by default for some videos; switch them off a few times while the player warms up
  const cmd = (func, args = []) => f.contentWindow?.postMessage(JSON.stringify({ event: "command", func, args }), "*");
  f.addEventListener("load", () => {
    f.contentWindow?.postMessage(JSON.stringify({ event: "listening" }), "*");
    [300, 900, 1800, 3500].forEach(t => setTimeout(() => { cmd("unloadModule", ["captions"]); cmd("unloadModule", ["cc"]); }, t));
    cmd("addEventListener", ["onReady"]);
    cmd("addEventListener", ["onStateChange"]);
    cmd(previewActive ? "playVideo" : "pauseVideo");
  });
  card.querySelector(".bg").appendChild(f);
  return f;
}


// Keep the thumbnail visible while paused or buffering so YouTube's
// startup controls stay hidden until they have faded during playback.
addEventListener("message", e => {
  const st = state.find(item => item.frame?.contentWindow === e.source);
  if (!st?.frame || e.origin !== "https://www.youtube-nocookie.com") return;
  let data;
  try { data = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch { return; }
  if (data?.event === "onReady") {
    st.frame.contentWindow?.postMessage(JSON.stringify({ event: "command", func: st.playing ? "playVideo" : "pauseVideo", args: [] }), e.origin);
  }
  const playerState = data?.event === "onStateChange" ? data.info : data?.info?.playerState;
  if (typeof playerState !== "number") return;
  if (previewActive && st.playing && playerState === 1) {
    if (!st.frame.classList.contains("on") && st.revealTimer === null) {
      const frame = st.frame;
      // YouTube briefly shows its center controls even with controls=0.
      // Reveal only after uninterrupted playback has let that overlay fade.
      st.revealTimer = setTimeout(() => {
        st.revealTimer = null;
        if (st.frame === frame && previewActive && st.playing) frame.classList.add("on");
      }, 4000);
    }
  } else {
    clearTimeout(st.revealTimer); st.revealTimer = null;
    st.frame.classList.remove("on");
  }
});

function layout() {
  cards.forEach((c, i) => {
    let d = mod(i * STEP - offset, L); if (d > L / 2) d -= L;
    c.style.transform = `translate3d(0, ${TOP + d}px, 0)`;
    c.style.visibility = Math.abs(d) < 900 ? "visible" : "hidden";
    const st = state[i], near = Math.abs(d);
    if (near < STEP * 2.2 && !st.frame) st.frame = mount(c, MIXES[i]);
    else if (near > STEP * 2.9 && st.frame) { clearTimeout(st.revealTimer); st.revealTimer = null; st.frame.remove(); st.frame = null; st.playing = null; }
    const play = previewActive;
    if (st.frame && play !== st.playing) {
      st.playing = play;
      if (!play) { clearTimeout(st.revealTimer); st.revealTimer = null; st.frame.classList.remove("on"); }
      st.frame.contentWindow?.postMessage(JSON.stringify({ event: "command", func: play ? "playVideo" : "pauseVideo", args: [] }), "*");
    }
  });
  const a = mod(Math.round(offset / STEP), N);
  if (a !== active) { cards[active]?.classList.remove("active"); cards[a].classList.add("active"); active = a; }
}
function tick(now) {
  if (!previewActive) return;
  const dt = Math.min(64, now - last); last = now;
  if (!held) offset += (target - offset) * (1 - Math.exp(-dt / 150));
  layout();
  animationFrame = requestAnimationFrame(tick);
}
const snap = (o) => Math.round(o / STEP) * STEP;
function step(n) { target = snap(target) + n * STEP; }
function nearestDelta(i) { let d = mod(i - active, N); if (d > N / 2) d -= N; return d; }

// auto-scroll for recording
let auto = true, timer;
function schedule() { clearTimeout(timer); if (auto && previewActive) timer = setTimeout(() => { step(1); schedule(); }, HOLD); }
function pauseAuto() { auto = false; clearTimeout(timer); }
function toggleAuto() { auto = !auto; schedule(); }

// keys
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); toggleAuto(); }
  else if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); step(1); pauseAuto(); }
  else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); step(-1); pauseAuto(); }
  else if (e.key.toLowerCase() === "h") { hint.classList.toggle("gone"); }
});

// wheel / trackpad: move freely, settle on the nearest card once input stops
let wheelIdle;
addEventListener("wheel", e => {
  e.preventDefault(); pauseAuto();
  held = true;
  const s = parseFloat(screen.style.getPropertyValue("--s")) || 1;
  offset += (e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) / s; target = offset;
  clearTimeout(wheelIdle);
  wheelIdle = setTimeout(() => { held = false; target = snap(offset); }, 140);
}, { passive: false });

// drag (mouse or touch) with a flick
let dragY = null, dragMoved = false, vel = 0, lastY = 0, lastT = 0;
screen.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) return;
  dragY = lastY = e.clientY; lastT = performance.now(); vel = 0; dragMoved = false; held = true;
});
addEventListener("pointermove", e => {
  if (dragY == null) return;
  const s = parseFloat(screen.style.getPropertyValue("--s")) || 1, now = performance.now();
  const dy = (lastY - e.clientY) / s;
  if (Math.abs(e.clientY - dragY) > 6) { dragMoved = true; pauseAuto(); }
  offset += dy; target = offset;
  vel = 0.8 * vel + 0.2 * (dy / Math.max(1, now - lastT));
  lastY = e.clientY; lastT = now;
});
addEventListener("pointerup", () => {
  if (dragY == null) return; dragY = null; held = false;
  target = snap(offset + Math.max(-1, Math.min(1, vel * 260 / STEP)) * STEP);
  setTimeout(() => dragMoved = false, 0);
});

// fit the 375×812 screen to 78% of a square stage, like the reference composition
function fit() {
  const side = Math.min(innerWidth, innerHeight);
  const s = Math.min((side * 0.783) / 812, (innerWidth - 32) / 375);
  screen.style.setProperty("--s", s);
}
addEventListener("resize", fit); fit();

const hint = document.getElementById("hint");
setTimeout(() => hint.classList.add("gone"), 5000);

addEventListener("message", e => {
  if (e.source !== parent || e.data?.type !== "portfolio-preview") return;
  const wasActive = previewActive;
